<!-- Degradado del orbe PMBOK para los medidores de avance -->
<svg width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true" focusable="false">

<div class="disposicion">

  <aside class="lateral" id="lateral">
    <div class="lateral-interior">
      <div class="filtro-lateral">
        <input type="search" id="filtro-arbol" placeholder="Filtrar el menú…" aria-label="Filtrar el menú lateral" autocomplete="off">
      </div>
      <nav id="arbol" class="arbol" aria-label="Navegación principal"></nav>
      <div class="lateral-pie">
        <span><kbd>Ctrl</kbd><kbd>K</kbd> buscar y actuar</span>
      </div>
    </div>
  </aside>
  <div class="velo" id="velo" hidden></div>

  <!-- ══════════════ Contenido ══════════════ -->
  <main class="contenido" id="contenido" tabindex="-1"></main>

</div>

<!-- ══════════════ Paleta de búsqueda ══════════════ -->
<div class="capa-buscador" id="capa-buscador" hidden>
  <div class="panel-buscador" role="dialog" aria-modal="true" aria-label="Buscar y actuar">
    <div class="panel-buscador-campo">
      <svg class="ic" viewBox="0 0 256 256" aria-hidden="true"><path d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"/></svg>
      <input type="search" id="entrada-busqueda" placeholder="Proyectos, procesos, herramientas o acciones…" autocomplete="off" spellcheck="false">
      <kbd>Esc</kbd>
    </div>
    <div class="panel-buscador-resultados" id="resultados-busqueda"></div>
    <div class="panel-buscador-pie">
      <span><kbd>↑</kbd><kbd>↓</kbd> navegar</span>
      <span><kbd>↵</kbd> abrir</span>
      <span id="conteo-busqueda"></span>
    </div>
  </div>
