<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestor PMBOK® 8 — Dirección de proyectos</title>
<meta name="description" content="Gestor de proyectos basado en la Guía PMBOK 8ª edición: 40 procesos guiados, documentos generados en secuencia, portafolios, equipos y verificación de calidad. Todo local, sin servidor.">
<link rel="stylesheet" href="assets/css/estilos.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◆</text></svg>">
</head>
<body>

<a class="salto-contenido" href="#contenido">Saltar al contenido</a>

<!-- ══════════════ Cabecera ══════════════ -->
<header class="cabecera">
  <button class="btn-icono solo-movil" id="btn-menu" aria-label="Abrir navegación" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>

  <a class="marca" href="#/panel">
    <span class="marca-glifo" aria-hidden="true">◆</span>
    <span class="marca-texto">
      <strong>Gestor PMBOK<span class="sup">®</span> 8</strong>
      <em>Dirección de proyectos</em>
    </span>
  </a>

  <button class="buscador-disparador" id="abrir-buscador" aria-label="Buscar proyectos, procesos y acciones">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <span>Buscar proyecto, proceso o acción…</span>
    <kbd>Ctrl</kbd><kbd>K</kbd>
  </button>

  <div class="g-usuario-cabecera" id="usuario-cabecera" hidden></div>

  <nav class="acciones-cabecera" aria-label="Preferencias">
    <button class="btn-icono" id="btn-tema" title="Cambiar tema claro u oscuro" aria-label="Cambiar tema claro u oscuro">
      <svg viewBox="0 0 24 24" aria-hidden="true" class="i-luna"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg viewBox="0 0 24 24" aria-hidden="true" class="i-sol"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </nav>
</header>

<div class="disposicion">

  <!-- ══════════════ Navegación lateral ══════════════ -->
  <aside class="lateral" id="lateral">
    <div class="lateral-interior">
      <div class="filtro-lateral">
        <input type="search" id="filtro-arbol" placeholder="Filtrar el menú…" aria-label="Filtrar el menú lateral" autocomplete="off">
      </div>
      <nav id="arbol" class="arbol" aria-label="Navegación principal"></nav>
      <div class="lateral-pie">
        <span><kbd>Ctrl</kbd><kbd>K</kbd> buscar y actuar</span>
      </div>
    </div>
  </aside>
  <div class="velo" id="velo" hidden></div>

  <!-- ══════════════ Contenido ══════════════ -->
  <main class="contenido" id="contenido" tabindex="-1"></main>

</div>

<!-- ══════════════ Paleta de búsqueda ══════════════ -->
<div class="capa-buscador" id="capa-buscador" hidden>
  <div class="panel-buscador" role="dialog" aria-modal="true" aria-label="Buscar y actuar">
    <div class="panel-buscador-campo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="entrada-busqueda" placeholder="Proyectos, procesos, herramientas o acciones…" autocomplete="off" spellcheck="false">
      <kbd>Esc</kbd>
    </div>
    <div class="panel-buscador-resultados" id="resultados-busqueda"></div>
    <div class="panel-buscador-pie">
      <span><kbd>↑</kbd><kbd>↓</kbd> navegar</span>
      <span><kbd>↵</kbd> abrir</span>
      <span id="conteo-busqueda"></span>
    </div>
  </div>
</div>

<!-- ══════════════ Datos ══════════════ -->
<script src="assets/js/datos/meta.js"></script>
<script src="assets/js/datos/principios.js"></script>
<script src="assets/js/datos/dominios.js"></script>
<script src="assets/js/datos/procesos.js"></script>
<script src="assets/js/datos/artefactos.js"></script>
<script src="assets/js/datos/herramientas.js"></script>
<script src="assets/js/datos/flujo.js"></script>
<script src="assets/js/datos/eos.js"></script>
<script src="assets/js/datos/secciones-proyecto.js"></script>

<!-- ══════════════ Aplicación ══════════════ -->
<script src="assets/js/almacenamiento.js"></script>
<script src="assets/js/indice.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/dialogos.js"></script>
<script src="assets/js/gestor.js"></script>
<script src="assets/js/archivos.js"></script>
<script src="assets/js/buscador.js"></script>
<script src="assets/js/calidad.js"></script>
<script src="assets/js/proyecto.js"></script>
<script src="assets/js/graficos.js"></script>
<script src="assets/js/vistas-aprender.js"></script>
<script src="assets/js/vistas-proyecto.js"></script>
<script src="assets/js/vistas-gestor.js"></script>
<script src="assets/js/vistas-obra.js"></script>
<script src="assets/js/obra-acciones.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
